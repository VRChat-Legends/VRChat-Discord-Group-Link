# =============================================================
# VRChat-Discord Group Link - config.yml
# Non-secret settings live here. Secrets stay in .env.
# Restart the bot after editing.
# =============================================================

# Log channels: the bot posts embeds about what it does. Right click a
# channel with Developer Mode on and Copy Channel ID. Leave empty to
# disable that log.
logs:
  # Link and unlink events (who linked to which VRChat account)
  link_channel_id: ""
  # Role changes the bot made (both Discord and VRChat side)
  role_channel_id: ""
  # Errors and warnings worth a human look (VRChat auth failures, etc.)
  alert_channel_id: ""

# Rich presence: the bot stays Online and rotates through these every
# 5 minutes. type: custom | watching | listening | playing
presence:
  - { type: custom, text: "/link to connect your VRChat" }
  - { type: watching, text: "the group | /link" }
  - { type: listening, text: "/ping" }

# VRChat group audit log feed: the bot polls your group's audit log and
# posts an embed for every event into the channel set for its category.
# A category with no channel falls back to default_channel_id; if that is
# empty too, that category is skipped. Costs 1 VRChat API call per poll.
group_logs:
  poll_seconds: 60
  channels:
    # Fallback for categories without their own channel and unknown events
    default_channel_id: ""
    # Instance warnings
    warn_channel_id: ""
    # Instance kicks and group kicks
    kick_channel_id: ""
    # Bans
    ban_channel_id: ""
    # Unbans
    unban_channel_id: ""
    # Members joining the group
    join_channel_id: ""
    # Members leaving or removed
    leave_channel_id: ""
    # Join requests (created, denied, blocked)
    join_request_channel_id: ""
    # Group invites
    invite_channel_id: ""
    # Group role changes (created, updated, assigned, removed)
    role_channel_id: ""
    # Group posts and announcements
    post_channel_id: ""
    # Group instances opened or closed
    instance_channel_id: ""
    # Group settings updates
    group_channel_id: ""

# Extra feeds pulled from the VRChat group.
feeds:
  # Mirror new group posts and announcements into this channel
  posts_channel_id: ""
  # Post pending join requests here with Accept and Deny buttons
  join_requests_channel_id: ""
  # How often to check for new posts and join requests (seconds)
  poll_seconds: 300

# Moderation behaviour for the buttons on group log posts.
moderation:
  # Open a thread on every actionable log for evidence and discussion,
  # pre-filled with the staff action template
  case_threads: true
  # Let admins ban and kick in VRChat straight from Discord buttons and
  # the /vrc-ban, /vrc-kick, /vrc-unban commands
  allow_actions_from_discord: true
